<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Store Management System</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="bg-light">
    <header>
      <nav class="navbar bg-info">
        <div class="container-fluid justify-content-center">
          <h1 class="text-white fw-semibold">Store Management System</h1>
        </div>
      </nav>
    </header>

    <section class="container my-4 bg-light">
      <div class="card p-4 w-50 mx-auto">
        <div class="d-flex flex-column gap-3">
          <div>
            <label for="ProductName" class="form-label">Product Name:</label>
            <input
              type="text"
              id="ProductName"
              class="form-control form-control-lg bg-light"
            />
          </div>

          <div>
            <label for="ProductPrice" class="form-label">Product Price:</label>
            <input
              type="number"
              id="ProductPrice"
              class="form-control form-control-lg bg-light"
            />
          </div>

          <div>
            <label for="ProductCategory" class="form-label"
              >Product Category:</label
            >
            <input
              type="text"
              id="ProductCategory"
              class="form-control form-control-lg bg-light"
            />
          </div>

          <div>
            <label for="ProductDescription" class="form-label"
              >Product Description:</label
            >
            <input
              type="text"
              id="ProductDescription"
              class="form-control form-control-lg bg-light"
            />
          </div>

          <div>
            <label for="ProductFile" class="form-label">Product File:</label>
            <input
              type="file"
              id="ProductFile"
              class="form-control form-control-lg bg-light"
            />
          </div>

          <button type="button" id="addBtn" class="btn btn-info w-25">
            Add Product
          </button>
          <button
            type="button"
            id="updateBtn"
            class="btn btn-warning w-25 d-none"
          >
            Update
          </button>
        </div>
      </div>
    </section>
    <section class="container py-4">
      <div class="w-100">
        <label for="search" class="form-label">Search by Name</label>
        <input type="search" id="search" class="form-control form-control-lg" />
      </div>
    </section>
    <section class="container pb-5">
      <div class="row g-4" id="productsContainer"></div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
